[project]
name = "mojo-tokenizers"
version = "0.1.0"
description = "Hugging Face tokenizer.json runtime for Mojo: byte-level BPE (GPT-2, Llama 3, Qwen)"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[dependency-groups]
dev = ["tokenizers==0.23.3"]  # the oracle: tools/oracle.py
